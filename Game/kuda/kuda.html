<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Game Balapan Kuda - RMH Games">
    <meta property="og:title" content="Game Balapan Kuda - RMH Games">
    <meta property="og:description" content="Klik secepat mungkin untuk memenangkan balapan kuda!">
    <meta property="og:type" content="website">
    <title>Balapan Kuda - RMH GAMES</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-arcade: #0D0221;
            --grid-color: rgba(0, 255, 255, 0.1);
            --neon-cyan: #00FFFF;
            --neon-magenta: #FF00FF;
            --neon-yellow: #FFFF00;
            --neon-green: #00FF00;
            --text-arcade: #F0F0F0;
            --card-arcade-bg: rgba(40, 20, 80, 0.8);
        }

        html { scroll-behavior: smooth; }
        
        body {
            background-color: var(--bg-arcade);
            color: var(--text-arcade);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100dvh;
            box-sizing: border-box;
            background-image: 
                linear-gradient(var(--grid-color) 1px, transparent 1px), 
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .back-button {
            position: fixed;
            top: 2rem;
            right: 2rem;
            width: 50px;
            height: 50px;
            background-color: var(--card-arcade-bg);
            border: 2px solid var(--neon-magenta);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            color: var(--neon-magenta);
            font-size: 1.5rem;
            z-index: 100;
            box-shadow: 0 0 15px var(--neon-magenta);
            transition: all 0.3s ease;
        }
        .back-button:hover {
            background-color: var(--neon-magenta);
            color: var(--bg-arcade);
            transform: scale(1.1) rotate(-15deg);
        }

        .game-container {
            background-color: var(--card-arcade-bg);
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 20px var(--neon-cyan);
            border-radius: 15px;
            padding: 2rem;
            max-width: 900px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-family: 'Press Start 2P', cursive;
            color: var(--neon-cyan);
            text-align: center;
            margin: 0 0 1.5rem 0;
            font-size: 2rem;
            text-shadow: 0 0 10px var(--neon-cyan);
        }

        #difficulty-selector {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .difficulty-btn {
            font-family: 'Press Start 2P', cursive;
            font-size: 0.65rem;
            background-color: transparent;
            border: 2px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 0.5rem 1rem;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .difficulty-btn:hover {
            background-color: var(--neon-cyan);
            color: var(--bg-arcade);
        }

        .difficulty-btn.active {
            background-color: var(--neon-magenta);
            border-color: var(--neon-magenta);
            color: var(--text-arcade);
        }

        #game-info {
            display: flex;
            justify-content: space-around;
            width: 100%;
            margin-bottom: 1rem;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.8rem;
            gap: 2rem;
        }

        #clicks {
            color: var(--neon-green);
        }

        #position {
            color: var(--neon-yellow);
        }

        #timer {
            color: var(--neon-magenta);
        }

        #gameCanvas {
            border: 2px solid var(--neon-magenta);
            box-shadow: 0 0 15px var(--neon-magenta);
            border-radius: 8px;
            background-color: rgba(0, 0, 0, 0.5);
            cursor: pointer;
            width: 100%;
            max-width: 800px;
        }

        #instruction {
            font-family: 'Press Start 2P', cursive;
            font-size: 0.9rem;
            color: var(--neon-yellow);
            margin-top: 1.5rem;
            text-align: center;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 50%, 100% { opacity: 1; }
            25%, 75% { opacity: 0.5; }
        }

        #game-over {
            text-align: center;
            margin-top: 2rem;
        }

        #game-over h2 {
            font-family: 'Press Start 2P', cursive;
            font-size: 1.5rem;
            margin-bottom: 1rem;
            text-shadow: 0 0 10px;
        }

        #game-over.win h2 {
            color: var(--neon-green);
            text-shadow: 0 0 10px var(--neon-green);
        }

        #game-over.lose h2 {
            color: var(--neon-magenta);
            text-shadow: 0 0 10px var(--neon-magenta);
        }

        #final-stats {
            font-size: 1rem;
            color: var(--text-arcade);
            margin-bottom: 1.5rem;
            line-height: 1.8;
        }

        #restart-btn {
            font-family: 'Press Start 2P', cursive;
            font-size: 1rem;
            background-color: var(--neon-cyan);
            color: var(--bg-arcade);
            border: none;
            padding: 1rem 2rem;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.3s ease;
        }

        #restart-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px var(--neon-cyan);
        }

        .hidden {
            display: none;
        }

        @media (max-width: 768px) {
            body { padding: 1rem; }
            h1 { font-size: 1.3rem; }
            #game-info { 
                font-size: 0.6rem;
                gap: 1rem;
                flex-wrap: wrap;
            }
            #instruction { font-size: 0.7rem; }
            .back-button { top: 1rem; right: 1rem; width: 45px; height: 45px; }
        }
    </style>
</head>
<body>
    <a href="../../games.html" class="back-button" title="Kembali">
        <i class="fa-solid fa-arrow-left"></i>
    </a>

    <div class="game-container">
        <h1>BALAPAN KUDA</h1>
        
        <div id="difficulty-selector">
            <button class="difficulty-btn" data-difficulty="easy">EASY</button>
            <button class="difficulty-btn active" data-difficulty="medium">MEDIUM</button>
            <button class="difficulty-btn" data-difficulty="hard">HARD</button>
        </div>
        
        <div id="game-info">
            <span id="clicks">Klik: 0</span>
            <span id="position">Posisi: 4/4</span>
            <span id="timer">Waktu: 0.0s</span>
        </div>

        <canvas id="gameCanvas" width="800" height="400"></canvas>

        <p id="instruction">KLIK / TAP LAYAR UNTUK BERLARI!</p>

        <div id="game-over" class="hidden">
            <h2 id="result-title"></h2>
            <div id="final-stats"></div>
            <button id="restart-btn">Balapan Lagi</button>
        </div>
    </div>

    <script src="kuda.js"></script>
</body>
</html>
